name: root-package
on:
  push:
    branches: [recovery-modules]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: github-root-original
          path: |
            README.md
            app.js
            icon-180.png
            icon-192.png
            icon-512.png
            index.html
            m
            manifest.json
            nav_assets.json
            sw.js
