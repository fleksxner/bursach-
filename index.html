<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бурсач</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script async src="https://telegram.org/js/telegram-web-app.js"></script>

<meta name="theme-color" content="#0E6B73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бурсач">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}

:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E4EAE9; --ink:#16242B; --muted:#5B6B70; --line:#D1DADA;
  --accent:#0E6B73; --accent-ink:#FFFFFF; --accent-soft:#D5E9EA; --amber:#C98A12;
  --good:#2F7D4F; --good-soft:#DCEFE3; --bad:#B53A2D; --bad-soft:#F6DEDA; --warn:#8A6100; --warn-soft:#F5EAC9;
  --info-soft:#E1E9F2; --info:#34557A;
  --sans:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow","Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1719; --surface:#172226; --sunk:#1D2A2E; --ink:#E3ECEB; --muted:#93A5A8; --line:#2B3B3F;
    --accent:#4FB3B5; --accent-ink:#06282B; --accent-soft:#18383B; --amber:#E4B24A;
    --good:#6CC08F; --good-soft:#18342A; --bad:#EE8A7C; --bad-soft:#3A201C; --warn:#E4B24A; --warn-soft:#352C14;
    --info-soft:#1B2A3A; --info:#9DBBDD;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1719; --surface:#172226; --sunk:#1D2A2E; --ink:#E3ECEB; --muted:#93A5A8; --line:#2B3B3F;
  --accent:#4FB3B5; --accent-ink:#06282B; --accent-soft:#18383B; --amber:#E4B24A;
  --good:#6CC08F; --good-soft:#18342A; --bad:#EE8A7C; --bad-soft:#3A201C; --warn:#E4B24A; --warn-soft:#352C14;
  --info-soft:#1B2A3A; --info:#9DBBDD;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font:700 19px/1 var(--cond);letter-spacing:.02em}
.brand svg{width:30px;height:30px;flex:none}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);min-width:0}
.crumbs a{color:var(--accent);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .cur{color:var(--ink)}
.crumbs .sep{opacity:.5}
h1,h2{font-family:var(--cond);text-wrap:balance;margin:0}
h1{font-size:clamp(24px,4.4vw,34px);line-height:1.12;font-weight:600}
h2{font-size:19px;font-weight:600;margin-block:28px 10px}
.blk h2{margin:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.home{display:grid;gap:22px;padding-top:28px}
.intro p{color:var(--muted);max-width:62ch;margin:8px 0 0}
.disc-list,.work-list{display:grid;gap:10px}
.disc,.work{display:flex;gap:14px;align-items:center;justify-content:space-between;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:border-color .15s,transform .15s}
.disc:hover,.work:hover{border-color:var(--accent)}
.disc:active,.work:active{transform:translateY(1px)}
.disc-name{font:600 18px/1.25 var(--cond)}
.disc-meta{font:500 13px var(--mono);color:var(--muted);white-space:nowrap}
.work{justify-content:flex-start;align-items:flex-start}
.work-no{font:600 13px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 8px;white-space:nowrap;margin-top:2px}
.work-body{display:grid;gap:3px}
.work-title{font:600 17px/1.25 var(--cond)}
.work-desc{font-size:13.5px;color:var(--muted)}
.hint,.small{font-size:13px;color:var(--muted);margin:0}
.work-page{display:grid;gap:14px;padding-top:22px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:500 14px var(--sans);padding:7px 13px;border-radius:7px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.stepper input{width:54px;text-align:center;font:500 15px var(--mono);padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
.stepper button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;line-height:1;cursor:pointer}
.stepper button:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
button{font-family:var(--sans)}
.actions button,.tools button,.filebtn,.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--sans);padding:8px 14px;border-radius:8px;cursor:pointer}
.actions .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.look{display:inline-flex;gap:4px}
.actions .look-btn{border:1px dashed var(--accent);color:var(--accent);background:var(--surface);font:500 14px var(--sans);padding:8px 12px;border-radius:8px;cursor:pointer}
.actions .look-btn b{font-family:var(--mono);font-weight:600}
.look-group{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions .tp-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--sans);padding:8px 12px;border-radius:8px;cursor:pointer}
.actions .tp-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.actions .tp-edit{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 14px var(--sans);padding:8px 10px;border-radius:8px;cursor:pointer}
.tp-modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px 16px;overflow-y:auto}
.tp-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;width:100%;max-width:640px;margin:auto 0}
.tp-card h2{margin:0;font-size:18px}
.actions .look-reset{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12.5px var(--mono);padding:8px 8px;border-radius:8px;cursor:pointer}
.ghost{padding:5px 11px;font-size:13.5px;color:var(--accent)}
.mode-hint{margin:0;font-size:13.5px;color:var(--muted);max-width:80ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:4px}
.tabs button{border:0;background:none;padding:10px 14px;font:600 15px var(--cond);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab-body{display:grid;gap:14px;padding-top:6px}
.tab-body.busy{opacity:.55;transition:opacity .2s}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px}
.fld{display:grid;gap:3px;min-width:0}
.fld.wide{grid-column:span 2}
.fld span{font-size:12.5px;color:var(--muted);line-height:1.25}
.fld span i{font-style:normal;font-family:var(--mono);font-size:11.5px;opacity:.85}
.fld input,.fld select{width:100%;min-width:0;font:15px var(--sans);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.fld input[inputmode]{font-family:var(--mono);font-size:14.5px}
.rows{display:grid;gap:8px}
.row{display:grid;gap:8px 10px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);position:relative}
.cargo-row{grid-template-columns:14px minmax(170px,2.2fr) repeat(2,minmax(78px,.8fr)) minmax(140px,1.3fr) minmax(110px,1fr) auto 32px}
.cargo-row .manual-only .fld{min-width:74px}
.swatch{width:14px;height:34px;border-radius:4px;border:1px solid rgba(0,0,0,.2);align-self:end}
.hold-row{grid-template-columns:44px repeat(10,minmax(64px,1fr)) 32px}
.hold-no{font:600 16px var(--cond);align-self:center;color:var(--accent)}
.compat-row{grid-template-columns:minmax(170px,1.3fr) minmax(150px,1fr) minmax(110px,.7fr) minmax(200px,2fr)}
.pair{font-weight:500;align-self:center;font-size:14px}
.pair i{font-style:normal;color:var(--muted)}
.row .fld.wide{grid-column:auto}
.del{width:32px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted);font-size:19px;cursor:pointer;align-self:end}
.del:hover{color:var(--bad);border-color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--bad)}
.tools .danger{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:500 15px var(--sans)}
.pill{font:600 12.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.verdict.good .pill{background:var(--good-soft);color:var(--good)}
.verdict.bad .pill{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{display:grid;gap:2px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font:500 20px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted)}
.plate{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px;overflow-x:auto}
.plate canvas{display:block;width:100%;min-width:560px;height:auto}
.notes{display:grid;gap:6px}
.note{margin:0;padding:9px 12px;border-radius:8px;font-size:14px;border-left:3px solid}
.note.ok{background:var(--good-soft);border-color:var(--good)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.note.info{background:var(--info-soft);border-color:var(--info)}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.data{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th{font:500 12.5px var(--sans);color:var(--muted);background:var(--sunk)}
table.data td{font-family:var(--mono);font-size:13.5px}
table.data .l{text-align:left;font-family:var(--sans);white-space:normal;min-width:170px}
table.data tr:last-child td{border-bottom:0}
table.data tr.sum td{font-weight:600;background:var(--sunk)}
.muted{color:var(--muted)}
table.data td.neg{color:var(--bad);font-weight:600}
.bar{display:inline-block;width:52px;height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.bar>span{display:block;height:100%;background:var(--accent)}
.bar.full>span{background:var(--amber)}
.bar.over>span{background:var(--bad)}
.pct{display:inline-block;min-width:48px}
.chip{font:600 12px var(--mono);padding:2px 8px;border-radius:99px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.pv-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px}
.pv-head h2{margin:0}
.pv-head .ghost{margin-left:auto}
.sheet-scroll{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:clamp(8px,3vw,28px);overflow-x:auto}
.sheet{background:#fff;color:#000;max-width:794px;min-width:320px;margin:0 auto;padding:clamp(18px,6vw,72px) clamp(14px,5vw,56px) clamp(18px,6vw,72px) clamp(18px,7vw,94px);box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.08);font:12pt/1.25 "Times New Roman","Liberation Serif",Times,serif;font-size:clamp(10px,2.6vw,16px)}
.sheet p{margin:0}
.sheet img{max-width:100%;height:auto}
.sheet .dt-wrap{overflow-x:auto;margin:0 0 6pt}
.sheet table.dt{border-collapse:collapse;margin:0 auto;width:100%;table-layout:fixed}
.sheet .dt th,.sheet .dt td{border:var(--bw,1px) solid #000;padding:1px 3px;vertical-align:middle;word-wrap:break-word}
.sheet .dt th{background:var(--thbg,#DCE6F1);font-weight:var(--thw,700);text-align:center}
.sheet .dt td.l{text-align:var(--fa,left)}
.sheet .dt td.c{text-align:center}
.sheet .dt tr.b td{font-weight:700}
.sheet hr.pb{border:0;border-top:1px dashed #999;margin:14px 0}
.pv-img{display:block;width:100%;height:auto}
.calc{margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery.pages{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.thumb{display:grid;gap:4px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font:12.5px/1.3 var(--sans)}
.thumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;background:var(--sunk)}
.gallery:not(.pages) .thumb img{aspect-ratio:4/3}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(10,16,18,.92);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
.viewer .vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.viewer img{display:block;max-width:none;width:180%;height:auto}
@media (min-width:900px){.viewer img{width:100%}}
.viewer .vcap{color:#fff;margin:6px 0 0;font-size:14px}
.vclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:2;width:44px;height:44px;border-radius:22px;border:0;background:#fff;color:#000;font-size:26px;cursor:pointer}
.boot{margin:24px 0;padding:12px 14px;border-radius:8px;background:var(--sunk);color:var(--ink);font-size:14.5px}
.boot.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.addc{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.addc select{max-width:260px;font:13.5px var(--sans);padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--accent)}
.man-list{display:grid;gap:10px}
.man{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.man h3{margin:0;font:600 17px/1.3 var(--cond)}
.man .meta{font-size:13px;color:var(--muted)}
.man .row-b{display:flex;gap:8px;flex-wrap:wrap}
.man .row-b a,.man .row-b button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--sans);padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none}
.man .row-b a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.disc.man-link{border-style:dashed}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pg{display:grid;gap:4px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink);font:12.5px var(--mono);text-align:center}
.pg img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:4px;background:var(--sunk)}
#mv img{width:100%}
.vnav{display:flex;gap:10px;justify-content:center;align-items:center;padding-top:8px;color:#fff;font:14px var(--mono)}
.vnav button{min-width:56px;height:44px;border-radius:22px;border:0;background:#fff;color:#000;font-size:22px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;max-width:calc(100% - 32px);transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
@media (max-width:860px){
  .row{padding-top:12px}
  .row .del{position:absolute;top:8px;right:8px;height:30px;width:30px}
  .cargo-row{grid-template-columns:1fr 1fr}
  .cargo-row>.swatch{position:absolute;left:0;top:10px;bottom:10px;width:4px;height:auto;border:0;border-radius:0 3px 3px 0}
  .cargo-row>.fld:first-of-type{grid-column:1/-1;padding-right:40px}
  .hold-row{grid-template-columns:repeat(3,1fr)}
  .hold-no{grid-column:1/-1}
  .compat-row{grid-template-columns:1fr 1fr}
  .compat-row .pair,.compat-row .fld.wide{grid-column:1/-1}
  .actions{margin-left:0}
}
@media (max-width:480px){
  .grid{grid-template-columns:1fr 1fr}
  .fld.wide{grid-column:1/-1}
  .actions{width:100%}
  .actions button{flex:1}
  .actions .look{width:100%}
  .actions .look-reset{flex:0 0 auto}
  .blk{padding:12px}
  .seg{width:100%}
  .seg button{flex:1;padding:7px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ранний перехватчик ошибок: показывает текст ошибки прямо на странице */
window.__bootErr = function (msg) {
  var b = document.getElementById("boot");
  if (!b) { b = document.createElement("p"); b.id = "boot"; (document.getElementById("main") || document.body).appendChild(b); }
  b.className = "boot bad"; b.textContent = "Ошибка при запуске: " + msg + " — пришлите скриншот этого текста.";
};
window.onerror = function (m, src, line, col) { window.__bootErr(m + " (строка " + line + ":" + col + ")"); };
</script>

    Бурсач
  </a>
  <nav class="crumbs" id="crumbs" aria-label="Навигация"></nav>

<main class="wrap" id="main"><p class="boot" id="boot">Загрузка приложения… Если эта надпись не исчезает, значит на этом устройстве не запускаются скрипты страницы. Пришлите скриншот.</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ======================================================================
   БУРСАЧ — оболочка приложения, общие помощники, сборка Word (.docx)
   ====================================================================== */
var App = (function () {
  "use strict";
  var disciplines = [];     // [{id, name, short, works:[work]}]

  /* ---------- регистрация дисциплин и работ ---------- */
  function discipline(id, name, short) {
    var d = disciplines.filter(function (x) { return x.id === id; })[0];
    if (!d) { d = { id: id, name: name, short: short || "", works: [] }; disciplines.push(d); }

  }
  function register(discId, work) { discipline(discId).works.push(work); work.disc = discId; }

  /* ---------- форматирование ---------- */
  function f(x, n) {
    if (n === undefined) n = 1;
    if (!isFinite(x)) return "—";
    var s = (Math.round(x * Math.pow(10, n)) / Math.pow(10, n)).toFixed(n);
    if (s === "-0" || /^-0[,.]0+$/.test(s)) s = s.slice(1);
    return s.replace(".", ",");
  }
  function plural(n, one, few, many) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && !(b >= 12 && b <= 14)) return few;
    return many;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);

      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);

    }
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  /* ---------- хранилище (в браузере, только для удобства) ---------- */
  var store = {
    get: function (k) { try { var v = localStorage.getItem("bursach:" + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem("bursach:" + k, JSON.stringify(v)); } catch (e) { } },
    del: function (k) { try { localStorage.removeItem("bursach:" + k); } catch (e) { } }
  };

  /* ---------- уведомление ---------- */
  var toastTimer;

  }

  /* ---------- сохранение файла: в артефакте через downloads, иначе обычная загрузка ---------- */
  var dlPromise = null;
  function getDownloads() {
    if (!dlPromise) {
      dlPromise = (window.claude && typeof window.claude.use === "function")

        : Promise.resolve(null);

  }
  function saveFile(filename, blob) {
    return getDownloads().then(function (dl) {
      if (dl) {
        return dl.save({ filename: filename, data: blob }).then(function () { toast("Файл сохранён: " + filename); })

      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();

      toast(tg ? "Если файл не скачался — откройте приложение в браузере" : "Файл сохранён: " + filename);

  }

  }

  var T = CLASSIC.doc;   // оформление документа, который сейчас собирается
  function Docx(theme) {

      (o.caps ? "text-transform:uppercase;" : "") + (o.under ? "text-decoration:underline;" : "");

  function hPara(content, o) {

    return '<p style="text-align:' + al + ";line-height:" + ((o.line || T.line) / 240).toFixed(2) + ";margin:" + (o.before || 0) + "pt 0 " + (o.after === undefined ? T.after : o.after) + "pt;" +
      (o.indent ? "text-indent:" + o.indent + "cm;" : "") + (o.left ? "margin-left:" + (o.left / 17 * 100).toFixed(1) + "%;" : "") + '">' + (content || "&nbsp;") + "</p>";
  }
  function x(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  var ALIGN = { left: "left", center: "center", just: "both", right: "right" };
  function run(text, o) {
    o = o || {};
    var fn = x(T.font.name), sz = Math.round((o.size || 12) * T.scale * 2);
    var pr = '<w:rPr><w:rFonts w:ascii="' + fn + '" w:hAnsi="' + fn + '" w:cs="' + fn + '" w:eastAsia="' + fn + '"/>' +
      (o.bold ? "<w:b/>" : "") + (o.italic ? "<w:i/>" : "") + (o.caps ? "<w:caps/>" : "") + (o.color ? '<w:color w:val="' + o.color + '"/>' : "") +
      '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/>' + (o.under ? '<w:u w:val="single"/>' : "") + "</w:rPr>";
    return String(text).split("\n").map(function (line, i) {
      return "<w:r>" + pr + (i ? "<w:br/>" : "") + '<w:t xml:space="preserve">' + x(line) + "</w:t></w:r>";
    }).join("");
  }
  function pXml(content, o) {
    o = o || {};

      '<w:spacing w:before="' + Math.round((o.before || 0) * 20) + '" w:after="' + Math.round((o.after === undefined ? T.after : o.after) * 20) + '" w:line="' + (o.line || T.line) + '" w:lineRule="auto"/>' +

      }

  /* схема рейса (Рис. 1.1): порты на линии, отрезки пропорциональны расстояниям */
  function routeImage(inp) {
    var pts = [], L1 = +inp.L1 || 0, L2 = +inp.L2 || 0;
    function add(name, L, main) { pts.push({ n: name, L: L, main: main }); }
    function legPts(a, b, Lab, start) {
      var rr = window.TMPRef && a && b ? TMPRef.route(a, b) : null;
      if (rr && Math.abs(rr.L - Lab) < 0.5 && rr.path.length > 2) {
        var acc = start;
        for (var i = 1; i < rr.path.length - 1; i++) { acc += rr.legs[i - 1]; add(TMPRef.title(rr.path[i]), acc, false); }
      }
    }
    add(inp.portLoad || "Порт погрузки", 0, true);
    legPts(inp.portLoad, inp.portD1, L1, 0);
    add(inp.portD1 || "Порт выгрузки 1", L1, true);
    legPts(inp.portD1, inp.portD2, L2, L1);
    add(inp.portD2 || "Порт выгрузки 2", L1 + L2, true);
    var W = 2000, H = 560, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var c = cv.getContext("2d"), LK = App.look(S.data.look).plan, INK = LK.ink || "#1d3557", FONT = LK.font;
    c.fillStyle = "#fff"; c.fillRect(0, 0, W, H);
    var tot = L1 + L2 || 1, x0 = 150, x1 = W - 150, y = 290;
    pts.forEach(function (p) { p.x = x0 + (x1 - x0) * p.L / tot; });
    for (var i = 1; i < pts.length; i++) if (pts[i].x - pts[i - 1].x < 150) pts[i].x = Math.min(x1, pts[i - 1].x + 150);
    c.strokeStyle = INK; c.lineWidth = 6; c.setLineDash([]);
    c.beginPath(); c.moveTo(pts[0].x, y); c.lineTo(pts[pts.length - 1].x, y); c.stroke();
    c.textAlign = "center"; c.textBaseline = "middle";
    pts.forEach(function (p, i) {
      c.beginPath(); c.arc(p.x, y, p.main ? 22 : 12, 0, Math.PI * 2);
      c.fillStyle = p.main ? INK : "#fff"; c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
      c.fillStyle = "#111"; c.font = (p.main ? "700 50px " : "400 36px ") + FONT;
      c.fillText(p.n, p.x, p.main ? y - 70 : y + 60);
      if (p.main) { c.font = "400 34px " + FONT; c.fillStyle = "#555"; c.fillText(i === 0 ? "погрузка" : "выгрузка", p.x, y - 125); }
    });
    var mains = pts.filter(function (p) { return p.main; });
    [[mains[0], mains[1], "L₁ = " + f(L1, 0) + " миль"], [mains[1], mains[2], "L₂ = " + f(L2, 0) + " миль"]].forEach(function (q) {
      var xm = (q[0].x + q[1].x) / 2;
      c.font = "700 44px " + FONT; c.fillStyle = INK; c.fillText(q[2], xm, y + 140);
      c.strokeStyle = "#999"; c.lineWidth = 2; c.beginPath(); c.moveTo(q[0].x, y + 100); c.lineTo(q[1].x, y + 100); c.stroke();
      [q[0].x, q[1].x].forEach(function (xx) { c.beginPath(); c.moveTo(xx, y + 88); c.lineTo(xx, y + 112); c.stroke(); });
    });
    c.font = "400 38px " + FONT; c.fillStyle = "#333";
    c.fillText("L = L₁ + L₂ = " + f(tot, 0) + " миль   ·   V = " + f(inp.speed, 0) + " уз", W / 2, H - 50);
    var url = cv.toDataURL("image/png");
    return { png: dataUrlBytes(url), w: W, h: H, url: url };
  }

    d.sub("Таблица 3.5. Проверка вместимости и допускаемых нагрузок");

      r.holds.map(function (h) {
        return ["№" + h.no, h.cargo.map(function (x) { return x.name; }).join(", ") || "порожний", f(h.q), f(h.w), f(h.cap, 0), f(h.use * 100),
          f(h.qFact, 2), f(h.qDop, 1), f(h.pDop, 0), h.okV && h.okP ? "ОК" : "проверить"];
      }).concat([["Σ", "Всего по судну", f(r.loadQ), f(r.loadW), f(r.totalCap, 0), f(r.totalUse * 100), "—", "—", "—", ""]]),
      { widths: [1.2, 3.8, 1.5, 1.6, 1.7, 1.7, 1.5, 1.5, 1.5, 1.6], boldLast: true, size: 9 });
    unloadedDocx(d, r);
    d.text("Удельная нагрузка на второе дно проверяется по условию q = Q / S ≤ qдоп, масса груза в отсеке — по условию Q ≤ Pдоп. Результат: " + r.verdict + ".");

    var pr = rs.map(function (c) { var t = window.TMPRef ? TMPRef.props(c.name) : ""; return t ? c.name + ": " + t : null; }).filter(Boolean);
    if (pr.length) {
      d.sub("Примечание по грузам:");
      pr.forEach(function (t, i) { d.para((i + 1) + ". " + t, { align: "just", after: 2, left: 0.6 }); });
      d.para("", { after: 4 });
    }
    d.sub("Схематичное расположение груза в трюмах (рис. 1." + fig + ")");
    d.image(png, pw, ph, 17, img.url);
    d.para("Рис. 1." + fig + ". Грузовой план судна (продольный разрез). Высота заливки пропорциональна занятому объёму трюма.", { align: "center", size: 10, after: 8 });
    d.table(["Трюм", "Груз", "Порт погрузки", "Порт выгрузки", "Q, т", "μ, м³/т", "W, м³"],
      r.cargoes.slice().sort(function (a, b) { return a.hold - b.hold; }).map(function (c) {
        return ["№" + c.hold, c.name, inp.portLoad, c.port, f(c.q), f(c.mu, 2), f(c.w)];
      }), { widths: [1.3, 4.6, 2.7, 2.7, 1.8, 1.6, 1.9] });
    totalsBlock(d, r);

    d.head("4. Координаты центра тяжести груза");
    d.formula("Xg = Σ(Pi·xi) / ΣPi ;   Zg = Σ(Pi·zi) / ΣPi");
    d.table(["Трюм", "Pi, т", "xi, м", "Pi·xi, т·м", "zi, м", "Pi·zi, т·м"],
      r.holds.map(function (h) { return ["№" + h.no, f(h.q), (h.x > 0 ? "+" : "") + f(h.x, 2), f(h.q * h.x), f(h.z, 2), f(h.q * h.z)]; })
        .concat([["Σ", f(r.loadQ), "—", f(r.sumPx), "—", f(r.sumPz)]]),
      { widths: [1.8, 2.6, 2.6, 3.2, 2.6, 3.2], boldLast: true });
    d.formula("Xg = " + f(r.sumPx) + " / " + f(r.loadQ) + " = " + f(r.xg, 2) + " м        Zg = " + f(r.sumPz) + " / " + f(r.loadQ) + " = " + f(r.zg, 2) + " м");
    d.text("Полученное положение центра тяжести груза даёт " + r.trim + ". При окончательном расчёте грузового плана он компенсируется приёмом балласта и размещением судовых запасов, а при необходимости — перераспределением части груза между трюмами.");

    d.head("5. Выводы");
    var sh = [];
    r.holds.forEach(function (h) {
      var ids = []; h.cargo.forEach(function (x) { if (ids.indexOf(x.ci) < 0) ids.push(x.ci); });
      if (ids.length > 1) sh.push("№" + h.no + " — " + ids.map(function (i) { return short(r.base[i].name); }).join(" и "));
    });
    var sep = idx2.length ? "грузы с индексом 2 (" + pairsText(idx2) + ") разделены не менее чем одним трюмом" : "требования к удалению отсеков соблюдены";
    d.numbered([
      "Запасы на рейс " + inp.portLoad + " — " + inp.portD1 + " — " + inp.portD2 + " (L = " + f(R.L, 0) + " миль, T = " + f(R.tVoyage, 0) + " сут) составляют " + f(R.pTotal, 2) + " т, в том числе топливо " + f(R.pFuel, 2) + " т, пресная вода " + f(R.pWater, 2) + " т, смазочные материалы " + f(R.pOil, 2) + " т, прочие " + f(R.pMisc, 1) + " т.",
      (mx ? "Максимально возможная загрузка судна без нарушения правил перевозки — " + f(r.loadQ) + " т общим объёмом " + f(r.loadW) + " м³" + (r.maxInfo.dw ? " при чистой грузоподъёмности " + f(r.maxInfo.dwNet, 2) + " т" + (r.maxInfo.dwBound ? " (судно загружено по дедвейту полностью)" : "") : "")
          : r.unloaded.length ? "В грузовых помещениях по правилам совместимости размещено " + f(r.loadQ) + " т груза (" + f(r.loadW) + " м³) из " + f(r.totalQ) + " т; не вместилось " + f(r.unQ) + " т (" + r.unloaded.map(function (u) { return u.name.toLowerCase() + " — " + f(u.q) + " т"; }).join(", ") + ")"
          : "Вся предъявленная партия груза — " + f(r.totalQ) + " т общим объёмом " + f(r.totalW) + " м³ — размещается в грузовых помещениях судна") +
        "; грузовместимость используется на " + f(r.totalUse * 100) + " %.",
      "Размещение груза выполнено с учётом таблицы совместимости: " + sep + ". " + (sh.length ? "В одном трюме совмещены: " + sh.join("; ") + "." : "Совмещения разных грузов в одном трюме нет."),
      "Удельные нагрузки на второе дно и допускаемые массы груза в отсеках " + (r.allOk ? "не превышены" : "в отдельных трюмах превышены") + ": " + r.verdict.charAt(0).toLowerCase() + r.verdict.slice(1) + ".",
      "Центр тяжести груза: Xg = " + f(r.xg, 2) + " м, Zg = " + f(r.zg, 2) + " м — " + r.trim + ", что учитывается при балластировке судна.",
      "Суммарная масса груза и запасов составляет " + f(r.pAll) + " т."
    ]);
    d.text(chiefReport("из расчётов следует, что груз размещён с соблюдением таблицы совместимости и допускаемых нагрузок, судно " + (inp.ship ? "«" + inp.ship + "» " : "") + "готово к выходу в рейс. На судне " + f(R.pTotal, 0) + " т запасов, общая масса груза на судне — " + f(r.loadQ, 0) + " т."), { before: 10 });
    return d;
  }

  /* ======================================================================
     ИНТЕРФЕЙС
     ====================================================================== */
  var root, planCanvas;
  var MODES = [["auto", "Автоподбор"], ["max", "Макс. загрузка"], ["manual", "Ручной"]];

  function fieldHtml(id, label, val, o) {
    o = o || {};
    return '<label class="fld' + (o.wide ? " wide" : "") + '" for="' + id + '"><span>' + label + (o.unit ? ' <i>' + o.unit + "</i>" : "") + "</span>" +
      '<input id="' + id + '" data-k="' + (o.key || "") + '" ' + (o.num ? 'inputmode="decimal"' : "") + ' value="' + esc(val) + '" autocomplete="off"></label>';
  }
  function selHtml(id, label, val, opts, key) {
    return '<label class="fld" for="' + id + '"><span>' + label + '</span><select id="' + id + '" data-k="' + key + '">' +
      opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(val) ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") +
      "</select></label>";
  }

  function render(main) {
    load();
    root = el("div", { class: "work-page" });
    main.appendChild(root);
    root.innerHTML =
      '<header class="wp-head"><p class="eyebrow">' + esc(CFG.eyebrow) + '</p><h1>' + esc(CFG.title) + '</h1></header>' +
      '<div class="controls">' +
        '<div class="seg" role="radiogroup" aria-label="Режим размещения">' +
          MODES.map(function (m) { return '<button type="button" role="radio" data-mode="' + m[0] + '">' + m[1] + "</button>"; }).join("") +
        "</div>" +
        '<div class="stepper" id="stepper"><button type="button" id="prevV" aria-label="Предыдущий вариант">‹</button>' +
          '<label for="placementNo">вариант размещения</label><input id="placementNo" inputmode="numeric"><span id="ofN"></span>' +
          '<button type="button" id="nextV" aria-label="Следующий вариант">›</button></div>' +
        '<div class="actions"><button type="button" class="primary" id="btnDocx">Скачать отчёт Word</button><button type="button" id="btnPng">Схема PNG</button></div>' +
      "</div>" +
      '<p class="mode-hint" id="modeHint"></p>' +
      '<div class="tabs" role="tablist"><button type="button" role="tab" data-tab="input">Вводные данные</button><button type="button" role="tab" data-tab="result">Расчёт и схема</button><button type="button" role="tab" data-tab="preview">Предпросмотр</button></div>' +
      '<div id="tab-input" class="tab-body"></div><div id="tab-result" class="tab-body"></div><div id="tab-preview" class="tab-body"></div>';

    root.querySelectorAll("[data-mode]").forEach(function (b) {
      b.addEventListener("click", function () { S.data.mode = b.dataset.mode; save(); syncControls(); recompute(true); });
    });
    root.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { S.tab = b.dataset.tab; syncTabs(); if (S.tab === "preview") showPreview(); });
    });
    var pn = root.querySelector("#placementNo");
    pn.addEventListener("input", function () { S.data.placementNo = parseInt(pn.value, 10) || 1; save(); recompute(); });
    root.querySelector("#prevV").addEventListener("click", function () { step(-1); });
    root.querySelector("#nextV").addEventListener("click", function () { step(1); });
    root.querySelector("#btnDocx").addEventListener("click", downloadDocx);
    root.querySelector("#btnPng").addEventListener("click", downloadPng);
    var lb = App.lookButton(S.data, function () { save(); S.doc = null; if (S.res) showResult(); renderCargo(); });
    root.querySelector(".actions").insertBefore(lb, root.querySelector("#btnDocx"));
    renderInputs();
    syncControls(); syncTabs();
    recompute(true);
  }
  function variantsCount() {
    var r = S.res; if (!r) return 1;
    if (r.mode === "max") return r.maxInfo ? r.maxInfo.nTop : 1;
    if (!r.nFeasible && r.partInfo) return r.partInfo.n || 1;
    return r.nFeasible || 1;
  }
  function step(dir) {
    var n = variantsCount(), cur = ((S.res && S.res.chosenIndex) || 0) + 1;
    var nx = ((cur - 1 + dir) % n + n) % n + 1;
    S.data.placementNo = nx; save();
    root.querySelector("#placementNo").value = nx; recompute(true);
  }
  function syncControls() {
    root.querySelectorAll("[data-mode]").forEach(function (b) { b.setAttribute("aria-checked", b.dataset.mode === S.data.mode ? "true" : "false"); });
    root.querySelector("#stepper").hidden = S.data.mode === "manual";
    root.querySelector("#placementNo").value = S.data.placementNo || 1;
    root.querySelector("#modeHint").textContent = {
      auto: "Программа перебирает все допустимые раскладки заданного груза (с учётом совместимости, вместимости, Pдоп и qдоп). Номер варианта выбирает одну из них — удобно, чтобы у всех в группе были разные ответы.",
      max: "Сначала грузится весь предъявленный груз, затем судно догружается теми же грузами до дедвейта (за вычетом запасов) и вместимости трюмов. Совместимость, Pдоп и qдоп не нарушаются.",
      manual: "Трюм для каждого груза задаёте сами (поле «Трюм» у груза). Программа только проверит размещение."
    }[S.data.mode];
    root.querySelectorAll(".manual-only").forEach(function (x) { x.hidden = S.data.mode !== "manual"; });
  }
  function syncTabs() {
    root.querySelectorAll("[data-tab]").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === S.tab ? "true" : "false"); });
    root.querySelector("#tab-input").hidden = S.tab !== "input";
    root.querySelector("#tab-result").hidden = S.tab !== "result";
    root.querySelector("#tab-preview").hidden = S.tab !== "preview";
  }

  /* ---------- форма вводных данных ---------- */
  function renderInputs() {
    var t = root.querySelector("#tab-input"), d = S.data;
    var nf = function (k, label, unit) { return fieldHtml("in-" + k, label, d[k], { key: k, num: true, unit: unit }); };
    var tf = function (k, label, wide) { return fieldHtml("in-" + k, label, d[k], { key: k, wide: wide }); };
    t.innerHTML = (!CFG.voyage
      ? '<section class="blk"><h2>Оформление и судно</h2><div class="grid">' + tf("variant", "Вариант №") +
        tf("authors", "Разработали (подпись на схеме)", true) + nf("dw", "Дедвейт судна DW (для макс. загрузки)", "т") +
        nf("stores", "Запасы на рейс, вычитаются из DW", "т") + "</div></section>"
      : '<section class="blk"><h2>Рейс и нормы расхода</h2><div class="grid">' +
        tf("variant", "Вариант №") +
        tf("ship", "Судно (т/х)") + nf("dw", "Дедвейт судна DW (для макс. загрузки)", "т") +
        tf("portLoad", "Порт погрузки") + tf("portD1", "Порт выгрузки 1") + tf("portD2", "Порт выгрузки 2") +
        nf("L1", "L₁, погрузка → выгрузка 1", "мили") + nf("L2", "L₂, выгрузка 1 → выгрузка 2", "мили") +
        nf("speed", "Скорость V", "уз") + nf("tCargo", "Стоянка под грузовыми операциями", "сут") + nf("kStorm", "Kшт, штормовой запас") +
        nf("qHfo", "Тяжёлое топливо на ходу", "т/сут") + nf("qDo", "Дизельное топливо", "т/сут") + nf("qWater", "Пресная вода", "т/сут") +
        nf("pOther", "Прочие запасы Pпр (40 короткий / 80 длит.)", "т") +
      '</div><p class="small" id="routeNote"></p><datalist id="portsList">' + (window.TMPRef ? TMPRef.NAMES.map(function (n) { return '<option value="' + esc(TMPRef.title(n)) + '">'; }).join("") : "") + "</datalist></section>") +
      '<section class="blk"><div class="blk-h"><h2>Груз к перевозке</h2><span class="addc"><select id="cargoPreset" aria-label="Груз из таблицы методички"><option value="">+ груз из методички…</option>' +
        (window.TMPRef ? TMPRef.CARGO.map(function (c, i) { return '<option value="' + i + '">' + esc(c[0]) + " — μ " + esc(c[3]) + "</option>"; }).join("") : "") +
        '</select><button type="button" class="ghost" id="addCargo">+ груз</button></span></div><div id="cargoList" class="rows"></div></section>' +
      '<section class="blk"><div class="blk-h"><h2>Трюмы судна</h2><button type="button" class="ghost" id="addHold">+ трюм</button></div><p class="small">Трюм №1 — носовой. X &gt; 0 — в нос от миделя, Z — от основной плоскости.</p><div id="holdList" class="rows"></div></section>' +
      '<section class="blk"><h2>Совместимость грузов</h2><p class="small">Пары строятся по списку грузов сами. «В одном трюме»: <b>можно</b> — только если между грузами есть сепарация (ограждение, переборка) и это допускает индекс; <b>нельзя</b> — только разные трюмы. Что не вмещается по правилам, выносится отдельно как «не вместилось».</p><div id="compatList" class="rows"></div></section>' +
      '<section class="blk tools"><button type="button" id="btnReset">Вернуть вариант ' + esc(defaults().variant) + '</button><button type="button" id="btnExport">Сохранить вводные (JSON)</button>' +
        '<label class="filebtn" for="fileImport">Загрузить вводные<input type="file" id="fileImport" accept=".json,application/json"></label>' +
        '<span class="confirm" id="resetConfirm" hidden>Все изменения пропадут. <button type="button" class="danger" id="resetYes">Сбросить</button><button type="button" id="resetNo">Отмена</button></span></section>';

    t.querySelectorAll(".grid input[data-k]").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var k = inp.dataset.k, v = inp.value;
        var numeric = ["L1", "L2", "speed", "tCargo", "kStorm", "qHfo", "qDo", "qWater", "pOther", "dw", "stores"].indexOf(k) >= 0;
        S.data[k] = numeric ? parseNum(v) : v;

    ["portLoad", "portD1", "portD2"].forEach(function (k) {
      var el2 = t.querySelector("#in-" + k); if (!el2) return;
      el2.addEventListener("change", function () { autoRoute(true); });

    autoRoute(false);
    var pre = t.querySelector("#cargoPreset");
    if (pre) pre.addEventListener("change", function () {
      var c = TMPRef.CARGO[+pre.value]; if (!c) return;

    });
    t.querySelector("#addCargo").addEventListener("click", function () {
      S.data.cargoes.push({ name: "Новый груз " + (S.data.cargoes.length + 1), q: 100, mu: 1, hold: 1, kind: "сыпучий", port: S.data.portD1 });
      save(); renderCargo(); renderCompat(); recompute(true);
    });
    t.querySelector("#addHold").addEventListener("click", function () {
      var last = S.data.holds[S.data.holds.length - 1] || E.DEFAULTS.holds[0];
      var h = E.clone(last); h.no = S.data.holds.length + 1; h.frames = "";
      S.data.holds.push(h); save(); renderHolds(); recompute(true);
    });
    t.querySelector("#btnReset").addEventListener("click", function () { t.querySelector("#resetConfirm").hidden = false; });
    t.querySelector("#resetNo").addEventListener("click", function () { t.querySelector("#resetConfirm").hidden = true; });
    t.querySelector("#resetYes").addEventListener("click", function () {
      S.data = defaults(); save(); renderInputs(); syncControls(); recompute(true); App.toast("Вводные данные сброшены к варианту " + S.data.variant);
    });
    t.querySelector("#btnExport").addEventListener("click", function () {
      App.saveFile(CFG.file + "_вводные_вар" + safe(S.data.variant) + ".json", new Blob([JSON.stringify(S.data, null, 2)], { type: "application/json" }));
    });
    t.querySelector("#fileImport").addEventListener("change", function (e) {
      var file = e.target.files[0]; if (!file) return;
      file.text().then(function (txt) {
        var obj = JSON.parse(txt);

    [x1, x2].forEach(function (x) { c.beginPath(); c.moveTo(X(x), box.y - 10); c.lineTo(X(x), box.y + box.h + 10); c.stroke(); });
    [y1, y2].forEach(function (y) { c.beginPath(); c.moveTo(box.x - 20, Y(y)); c.lineTo(box.x + box.w + 20, Y(y)); c.stroke(); });
    c.setLineDash([]);
    // треугольник

    c.font = "600 28px " + FONT; c.fillStyle = INK;

/* ======================================================================
   МЕТОДИЧКИ: список пособий и просмотр страниц (файлы в папке m/)
   ====================================================================== */
(function () {
  "use strict";
  var esc = App.esc, el = App.el, idxP = null;
  function loadIndex() {
    if (!idxP) idxP = fetch("m/index.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function () { idxP = null; return null; });
    return idxP;
  }
  function pad(n) { return ("00" + n).slice(-3); }
  function offline(w) {
    w.innerHTML += '<p class="note warn">Методички открываются в онлайн-версии приложения (ссылка на GitHub или на claude.ai). В файле, открытом с компьютера без интернета, их нет — PDF лежат в папке «бурсач».</p>';
  }
  function downloadPdf(m, btn) {
    btn.disabled = true; btn.textContent = "Загружаю PDF…";
    fetch(m.pdf).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (b) { return App.saveFile(m.title.split(/[.—]/)[0].trim().slice(0, 60).replace(/[\\/:*?"<>|]+/g, "_") + ".pdf", b); })
      .catch(function () { App.toast("Не удалось загрузить PDF", true); })
      .then(function () { btn.disabled = false; btn.textContent = "Скачать PDF"; });
  }
  App.page({
    match: function (h) { return h === "manuals"; },
    crumbs: function () { return [{ label: "Дисциплины", hash: "" }, { label: "Методички" }]; },
    render: function (main) {
      var w = el("section", { class: "home" }); main.appendChild(w);
      w.innerHTML = '<div class="intro"><h1>Методички</h1><p>Все пособия по дисциплинам. Страницы открываются прямо в приложении, PDF можно скачать.</p></div>';
      loadIndex().then(function (ix) {
        if (!ix) return offline(w);
        var groups = {};
        ix.manuals.forEach(function (m) { (groups[m.disc] = groups[m.disc] || []).push(m); });
        Object.keys(groups).forEach(function (g) {
          w.appendChild(el("h2", null, esc(g)));
          var list = el("div", { class: "man-list" });
          groups[g].forEach(function (m) {
            var c = el("article", { class: "man" });
            c.innerHTML = "<h3>" + esc(m.title) + '</h3><p class="meta">' + esc(m.note) + " · " + m.n + " " + (m.id === "nav-video" ? App.plural(m.n, "кадр", "кадра", "кадров") : App.plural(m.n, "страница", "страницы", "страниц")) + "</p>" +
              '<div class="row-b"><a class="primary" href="#man-' + m.id + '">Открыть</a>' + (m.pdf ? '<button type="button">Скачать PDF</button>' : "") + "</div>";
            var b = c.querySelector("button"); if (b) b.addEventListener("click", function () { downloadPdf(m, b); });
            list.appendChild(c);
          });
          w.appendChild(list);
        });
      });
    }
  });
  App.page({
    match: function (h) { return /^man-[\w.~-]+$/.test(h); },
    crumbs: function () { return [{ label: "Дисциплины", hash: "" }, { label: "Методички", hash: "manuals" }, { label: "Просмотр" }]; },
    render: function (main, h) {
      var id = h.slice(4), w = el("div", { class: "work-page" }); main.appendChild(w);
      loadIndex().then(function (ix) {
        var m = ix && ix.manuals.filter(function (x) { return x.id === id; })[0];
        if (!m) { w.innerHTML = "<h1>Методичка</h1>"; return offline(w); }
        App.setCrumbs([{ label: "Дисциплины", hash: "" }, { label: "Методички", hash: "manuals" }, { label: m.title.slice(0, 40) + (m.title.length > 40 ? "…" : "") }]);

          '<div class="actions" style="margin-left:0">' + (m.pdf ? '<button type="button" class="primary" id="mPdf">Скачать PDF</button>' : "") + "</div>" +
          '<div class="pages" id="mPages"></div>' +
          '<div class="viewer" id="mv" hidden><button type="button" class="vclose" aria-label="Закрыть">×</button><div class="vscroll"><img alt=""></div><div class="vnav"><button type="button" id="mvPrev" aria-label="Предыдущая">‹</button><span id="mvNo"></span><button type="button" id="mvNext" aria-label="Следующая">›</button></div></div>';

        function lab(i) { return m.labels ? "стр. " + m.labels[i - 1] : (m.id === "nav-video" ? "кадр " + i : "стр. " + i); }
        function show(i) { cur = Math.max(1, Math.min(m.n, i)); v.querySelector("img").src = "m/" + m.id + "/" + pad(cur) + ".jpg"; v.querySelector("#mvNo").textContent = lab(cur) + " / " + m.n; v.querySelector(".vscroll").scrollTop = 0; v.hidden = false; }

          var b = el("button", { type: "button", class: "pg" });
          b.innerHTML = '<img loading="lazy" alt="' + lab(i) + '" src="m/' + m.id + "/" + pad(i) + '.jpg"><span>' + lab(i) + "</span>";
          b.addEventListener("click", function () { show(i); });
          box.appendChild(b);
        })(i);
        v.querySelector(".vclose").addEventListener("click", function () { v.hidden = true; });
        v.querySelector("#mvPrev").addEventListener("click", function () { show(cur - 1); });

      });
    }
  });
