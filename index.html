<!doctype html>


<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>Бурсач</title>
<meta content="#0E6B73" name="theme-color"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="Бурсач" name="apple-mobile-web-app-title"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" media="print" onload="this.media='all'" rel="stylesheet"/>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}

:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E4EAE9; --ink:#16242B; --muted:#5B6B70; --line:#D1DADA;
  --accent:#0E6B73; --accent-ink:#FFFFFF; --accent-soft:#D5E9EA; --amber:#C98A12;
  --good:#2F7D4F; --good-soft:#DCEFE3; --bad:#B53A2D; --bad-soft:#F6DEDA; --warn:#8A6100; --warn-soft:#F5EAC9;
  --info-soft:#E1E9F2; --info:#34557A;
  --sans:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow","Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1719; --surface:#172226; --sunk:#1D2A2E; --ink:#E3ECEB; --muted:#93A5A8; --line:#2B3B3F;
    --accent:#4FB3B5; --accent-ink:#06282B; --accent-soft:#18383B; --amber:#E4B24A;
    --good:#6CC08F; --good-soft:#18342A; --bad:#EE8A7C; --bad-soft:#3A201C; --warn:#E4B24A; --warn-soft:#352C14;
    --info-soft:#1B2A3A; --info:#9DBBDD;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1719; --surface:#172226; --sunk:#1D2A2E; --ink:#E3ECEB; --muted:#93A5A8; --line:#2B3B3F;
  --accent:#4FB3B5; --accent-ink:#06282B; --accent-soft:#18383B; --amber:#E4B24A;
  --good:#6CC08F; --good-soft:#18342A; --bad:#EE8A7C; --bad-soft:#3A201C; --warn:#E4B24A; --warn-soft:#352C14;
  --info-soft:#1B2A3A; --info:#9DBBDD;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font:700 19px/1 var(--cond);letter-spacing:.02em}
.brand svg{width:30px;height:30px;flex:none}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);min-width:0}
.crumbs a{color:var(--accent);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .cur{color:var(--ink)}
.crumbs .sep{opacity:.5}
h1,h2{font-family:var(--cond);text-wrap:balance;margin:0}
h1{font-size:clamp(24px,4.4vw,34px);line-height:1.12;font-weight:600}
h2{font-size:19px;font-weight:600;margin-block:28px 10px}
.blk h2{margin:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.home{display:grid;gap:22px;padding-top:28px}
.intro p{color:var(--muted);max-width:62ch;margin:8px 0 0}
.disc-list,.work-list{display:grid;gap:10px}
.disc,.work{display:flex;gap:14px;align-items:center;justify-content:space-between;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:border-color .15s,transform .15s}
.disc:hover,.work:hover{border-color:var(--accent)}
.disc:active,.work:active{transform:translateY(1px)}
.disc-name{font:600 18px/1.25 var(--cond)}
.disc-meta{font:500 13px var(--mono);color:var(--muted);white-space:nowrap}
.work{justify-content:flex-start;align-items:flex-start}
.work-no{font:600 13px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 8px;white-space:nowrap;margin-top:2px}
.work-body{display:grid;gap:3px}
.work-title{font:600 17px/1.25 var(--cond)}
.work-desc{font-size:13.5px;color:var(--muted)}
.hint,.small{font-size:13px;color:var(--muted);margin:0}
.work-page{display:grid;gap:14px;padding-top:22px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:500 14px var(--sans);padding:7px 13px;border-radius:7px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.stepper input{width:54px;text-align:center;font:500 15px var(--mono);padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
.stepper button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;line-height:1;cursor:pointer}
.stepper button:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
button{font-family:var(--sans)}
.actions button,.tools button,.filebtn,.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--sans);padding:8px 14px;border-radius:8px;cursor:pointer}
.actions .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.look{display:inline-flex;gap:4px}
.actions .look-btn{border:1px dashed var(--accent);color:var(--accent);background:var(--surface);font:500 14px var(--sans);padding:8px 12px;border-radius:8px;cursor:pointer}
.actions .look-btn b{font-family:var(--mono);font-weight:600}
.look-group{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions .tp-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--sans);padding:8px 12px;border-radius:8px;cursor:pointer}
.actions .tp-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.actions .tp-edit{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 14px var(--sans);padding:8px 10px;border-radius:8px;cursor:pointer}
.tp-modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px 16px;overflow-y:auto}
.tp-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;width:100%;max-width:640px;margin:auto 0}
.tp-card h2{margin:0;font-size:18px}
.actions .look-reset{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12.5px var(--mono);padding:8px 8px;border-radius:8px;cursor:pointer}
.ghost{padding:5px 11px;font-size:13.5px;color:var(--accent)}
.mode-hint{margin:0;font-size:13.5px;color:var(--muted);max-width:80ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:4px}
.tabs button{border:0;background:none;padding:10px 14px;font:600 15px var(--cond);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab-body{display:grid;gap:14px;padding-top:6px}
.tab-body.busy{opacity:.55;transition:opacity .2s}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px}
.fld{display:grid;gap:3px;min-width:0}
.fld.wide{grid-column:span 2}
.fld span{font-size:12.5px;color:var(--muted);line-height:1.25}
.fld span i{font-style:normal;font-family:var(--mono);font-size:11.5px;opacity:.85}
.fld input,.fld select{width:100%;min-width:0;font:15px var(--sans);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.fld input[inputmode]{font-family:var(--mono);font-size:14.5px}
.rows{display:grid;gap:8px}
.row{display:grid;gap:8px 10px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);position:relative}
.cargo-row{grid-template-columns:14px minmax(170px,2.2fr) repeat(2,minmax(78px,.8fr)) minmax(140px,1.3fr) minmax(110px,1fr) auto 32px}
.cargo-row .manual-only .fld{min-width:74px}
.swatch{width:14px;height:34px;border-radius:4px;border:1px solid rgba(0,0,0,.2);align-self:end}
.hold-row{grid-template-columns:44px repeat(10,minmax(64px,1fr)) 32px}
.hold-no{font:600 16px var(--cond);align-self:center;color:var(--accent)}
.compat-row{grid-template-columns:minmax(170px,1.3fr) minmax(150px,1fr) minmax(110px,.7fr) minmax(200px,2fr)}
.pair{font-weight:500;align-self:center;font-size:14px}
.pair i{font-style:normal;color:var(--muted)}
.row .fld.wide{grid-column:auto}
.del{width:32px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted);font-size:19px;cursor:pointer;align-self:end}
.del:hover{color:var(--bad);border-color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--bad)}
.tools .danger{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:500 15px var(--sans)}
.pill{font:600 12.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.verdict.good .pill{background:var(--good-soft);color:var(--good)}
.verdict.bad .pill{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{display:grid;gap:2px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font:500 20px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted)}
.plate{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px;overflow-x:auto}
.plate canvas{display:block;width:100%;min-width:560px;height:auto}
.notes{display:grid;gap:6px}
.note{margin:0;padding:9px 12px;border-radius:8px;font-size:14px;border-left:3px solid}
.note.ok{background:var(--good-soft);border-color:var(--good)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.note.info{background:var(--info-soft);border-color:var(--info)}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.data{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th{font:500 12.5px var(--sans);color:var(--muted);background:var(--sunk)}
table.data td{font-family:var(--mono);font-size:13.5px}
table.data .l{text-align:left;font-family:var(--sans);white-space:normal;min-width:170px}
table.data tr:last-child td{border-bottom:0}
table.data tr.sum td{font-weight:600;background:var(--sunk)}
.muted{color:var(--muted)}
table.data td.neg{color:var(--bad);font-weight:600}
.bar{display:inline-block;width:52px;height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.bar>span{display:block;height:100%;background:var(--accent)}
.bar.full>span{background:var(--amber)}
.bar.over>span{background:var(--bad)}
.pct{display:inline-block;min-width:48px}
.chip{font:600 12px var(--mono);padding:2px 8px;border-radius:99px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.pv-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px}
.pv-head h2{margin:0}
.pv-head .ghost{margin-left:auto}
.sheet-scroll{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:clamp(8px,3vw,28px);overflow-x:auto}
.sheet{background:#fff;color:#000;max-width:794px;min-width:320px;margin:0 auto;padding:clamp(18px,6vw,72px) clamp(14px,5vw,56px) clamp(18px,6vw,72px) clamp(18px,7vw,94px);box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.08);font:12pt/1.25 "Times New Roman","Liberation Serif",Times,serif;font-size:clamp(10px,2.6vw,16px)}
.sheet p{margin:0}
.sheet img{max-width:100%;height:auto}
.sheet .dt-wrap{overflow-x:auto;margin:0 0 6pt}
.sheet table.dt{border-collapse:collapse;margin:0 auto;width:100%;table-layout:fixed}
.sheet .dt th,.sheet .dt td{border:var(--bw,1px) solid #000;padding:1px 3px;vertical-align:middle;word-wrap:break-word}
.sheet .dt th{background:var(--thbg,#DCE6F1);font-weight:var(--thw,700);text-align:center}
.sheet .dt td.l{text-align:var(--fa,left)}
.sheet .dt td.c{text-align:center}
.sheet .dt tr.b td{font-weight:700}
.sheet hr.pb{border:0;border-top:1px dashed #999;margin:14px 0}
.pv-img{display:block;width:100%;height:auto}
.calc{margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery.pages{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.thumb{display:grid;gap:4px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font:12.5px/1.3 var(--sans)}
.thumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;background:var(--sunk)}
.gallery:not(.pages) .thumb img{aspect-ratio:4/3}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(10,16,18,.92);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
.viewer .vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.viewer img{display:block;max-width:none;width:180%;height:auto}
@media (min-width:900px){.viewer img{width:100%}}
.viewer .vcap{color:#fff;margin:6px 0 0;font-size:14px}
.vclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:2;width:44px;height:44px;border-radius:22px;border:0;background:#fff;color:#000;font-size:26px;cursor:pointer}
.boot{margin:24px 0;padding:12px 14px;border-radius:8px;background:var(--sunk);color:var(--ink);font-size:14.5px}
.boot.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.addc{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.addc select{max-width:260px;font:13.5px var(--sans);padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--accent)}
.man-list{display:grid;gap:10px}
.man{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.man h3{margin:0;font:600 17px/1.3 var(--cond)}
.man .meta{font-size:13px;color:var(--muted)}
.man .row-b{display:flex;gap:8px;flex-wrap:wrap}
.man .row-b a,.man .row-b button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--sans);padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none}
.man .row-b a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.disc.man-link{border-style:dashed}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pg{display:grid;gap:4px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink);font:12.5px var(--mono);text-align:center}
.pg img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:4px;background:var(--sunk)}
#mv img{width:100%}
.vnav{display:flex;gap:10px;justify-content:center;align-items:center;padding-top:8px;color:#fff;font:14px var(--mono)}
.vnav button{min-width:56px;height:44px;border-radius:22px;border:0;background:#fff;color:#000;font-size:22px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;max-width:calc(100% - 32px);transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
@media (max-width:860px){
  .row{padding-top:12px}
  .row .del{position:absolute;top:8px;right:8px;height:30px;width:30px}
  .cargo-row{grid-template-columns:1fr 1fr}
  .cargo-row>.swatch{position:absolute;left:0;top:10px;bottom:10px;width:4px;height:auto;border:0;border-radius:0 3px 3px 0}
  .cargo-row>.fld:first-of-type{grid-column:1/-1;padding-right:40px}
  .hold-row{grid-template-columns:repeat(3,1fr)}
  .hold-no{grid-column:1/-1}
  .compat-row{grid-template-columns:1fr 1fr}
  .compat-row .pair,.compat-row .fld.wide{grid-column:1/-1}
  .actions{margin-left:0}
}
@media (max-width:480px){
  .grid{grid-template-columns:1fr 1fr}
  .fld.wide{grid-column:1/-1}
  .actions{width:100%}
  .actions button{flex:1}
  .actions .look{width:100%}
  .actions .look-reset{flex:0 0 auto}
  .blk{padding:12px}
  .seg{width:100%}
  .seg button{flex:1;padding:7px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link href="manifest.json" rel="manifest"/><link href="icon-180.png" rel="apple-touch-icon"/><link href="icon-192.png" rel="icon"/><meta content="yes" name="mobile-web-app-capable"/></head>

<script>
/* ранний перехватчик ошибок: показывает текст ошибки прямо на странице */
window.__bootErr = function (msg) {
  var b = document.getElementById("boot");
  if (!b) { b = document.createElement("p"); b.id = "boot"; (document.getElementById("main") || document.body).appendChild(b); }
  b.className = "boot bad"; b.textContent = "Ошибка при запуске: " + msg + " — пришлите скриншот этого текста.";
};
window.onerror = function (m, src, line, col) { if (!src || /^Script error/i.test(String(m))) return; window.__bootErr(m + " (строка " + line + ":" + col + ")"); };
</script>
<div class="topbar"><div class="wrap">
<a aria-label="Бурсач — на главную" class="brand" href="#">
<svg aria-hidden="true" viewbox="0 0 32 32"><circle cx="16" cy="16" fill="none" r="11" stroke="currentColor" stroke-width="2.2"></circle><rect height="2.4" style="fill:var(--accent)" width="28" x="2" y="14.8"></rect></svg>
    Бурсач
  </a>
<nav aria-label="Навигация" class="crumbs" id="crumbs"></nav>
